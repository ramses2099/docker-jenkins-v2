services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - JAVA_OPTS=-Xmx512m -Djenkins.install.runSetupWizard=false
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

volumes:
  jenkins_home: